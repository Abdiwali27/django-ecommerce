services:
  - type: web
    name: django-ecommerce
    runtime: python
    plan: free

    buildCommand: bash build.sh

    startCommand: gunicorn Ecommerce.wsgi:application

    envVars:
      - key: PYTHON_VERSION
        value: 3.14.3

      - key: DEBUG
        value: False

      - key: SECRET_KEY
        generateValue: true

      - key: DATABASE_URL
        fromDatabase:
          name: django-ecommerce-db
          property: connectionString

      - key: CLOUDINARY_CLOUD_NAME
        sync: false

      - key: CLOUDINARY_API_KEY
        sync: false

      - key: CLOUDINARY_API_SECRET
        sync: false


databases:
  - name: django-ecommerce-db
    plan: free