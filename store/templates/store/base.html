<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>

        {% block title %}
            My Store
        {% endblock %}

    </title>


    <!-- Bootstrap -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <!-- Bootstrap Icons -->

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >


    <style>

        body {
            background-color: #f8f9fa;
        }


        .navbar-brand {
            font-weight: 700;
            letter-spacing: 0.5px;
        }


        .navbar-nav .nav-link {
            font-weight: 500;
            margin-left: 10px;
            margin-right: 10px;
        }


        .navbar-nav .nav-link:hover {
            color: #0d6efd;
        }


        main {
            min-height: 70vh;
        }


        footer {
            margin-top: 60px;
        }


        .footer-link {
            text-decoration: none;
            color: #adb5bd;
        }


        .footer-link:hover {
            color: white;
        }


        .product-card {
            transition: 0.3s ease;
        }


        .product-card:hover {
            transform: translateY(-5px);
        }


        .product-image {
            width: 100%;
            height: 230px;
            object-fit: cover;
        }

    </style>


    {% block extra_css %}
    {% endblock %}

</head>


<body>


<!-- =====================================================
     NAVBAR
====================================================== -->

{% include "store/navbar.html" %}


<!-- =====================================================
     MAIN
====================================================== -->

<main>

    {% block content %}

    {% endblock %}

</main>


<!-- =====================================================
     FOOTER
====================================================== -->

{% include "store/footer.html" %}


<!-- Bootstrap JS -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
></script>


{% block extra_js %}
{% endblock %}


</body>

</html>
