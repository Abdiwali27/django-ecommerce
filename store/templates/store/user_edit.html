{% extends "store/dashboard_base.html" %}

{% block title %}
Edit User - My Store
{% endblock %}


{% block dashboard_content %}

<div class="container-fluid" style="margin-top: 75px;">

    <div class="row justify-content-center">

        <div class="col-lg-8">


            <div class="mb-4">

                <h2 class="fw-bold mb-1">
                    Edit User
                </h2>

                <p class="text-muted">
                    Update user information and role.
                </p>

            </div>


            <div class="card border-0 shadow-sm rounded-4">

                <div class="card-body p-4 p-md-5">


                    <form method="POST">

                        {% csrf_token %}


                        <!-- USERNAME -->

                        <div class="mb-4">

                            <label
                                class="form-label fw-semibold"
                            >
                                Username
                            </label>

                            <input
                                type="text"
                                name="username"
                                class="form-control form-control-lg"
                                value="{{ edit_user.username }}"
                                required
                            >

                        </div>


                        <!-- EMAIL -->

                        <div class="mb-4">

                            <label
                                class="form-label fw-semibold"
                            >
                                Email Address
                            </label>

                            <input
                                type="email"
                                name="email"
                                class="form-control form-control-lg"
                                value="{{ edit_user.email }}"
                            >

                        </div>


                        <!-- FIRST NAME -->

                        <div class="mb-4">

                            <label
                                class="form-label fw-semibold"
                            >
                                First Name
                            </label>

                            <input
                                type="text"
                                name="first_name"
                                class="form-control form-control-lg"
                                value="{{ edit_user.first_name }}"
                            >

                        </div>


                        <!-- LAST NAME -->

                        <div class="mb-4">

                            <label
                                class="form-label fw-semibold"
                            >
                                Last Name
                            </label>

                            <input
                                type="text"
                                name="last_name"
                                class="form-control form-control-lg"
                                value="{{ edit_user.last_name }}"
                            >

                        </div>


                        <!-- ROLE -->

                        <div class="mb-4">

                            <label
                                class="form-label fw-semibold"
                            >
                                Role
                            </label>

                            <select
                                name="role"
                                class="form-select form-select-lg"
                                required
                            >

                                <option
                                    value="Staff"
                                    {% if edit_user.groups.first.name == "Staff" %}
                                        selected
                                    {% endif %}
                                >
                                    Staff
                                </option>

                                <option
                                    value="Admin"
                                    {% if edit_user.is_superuser %}
                                        selected
                                    {% endif %}
                                >
                                    Admin
                                </option>

                            </select>

                        </div>


                        <!-- ACTIVE STATUS -->

                        <div class="mb-4">

                            <div class="form-check form-switch">

                                <input
                                    class="form-check-input"
                                    type="checkbox"
                                    name="is_active"
                                    id="is_active"
                                    {% if edit_user.is_active %}
                                        checked
                                    {% endif %}
                                >

                                <label
                                    class="form-check-label fw-semibold"
                                    for="is_active"
                                >
                                    Active User
                                </label>

                            </div>

                        </div>


                        <!-- PASSWORD -->

                        <div class="mb-4">

                            <label
                                class="form-label fw-semibold"
                            >
                                New Password
                                <small class="text-muted">
                                    (optional)
                                </small>
                            </label>

                            <input
                                type="password"
                                name="password"
                                class="form-control form-control-lg"
                                placeholder="Leave blank to keep current password"
                            >

                        </div>


                        <!-- BUTTONS -->

                        <div class="d-flex gap-2">

                            <button
                                type="submit"
                                class="btn btn-primary btn-lg px-4"
                            >

                                <i class="bi bi-check-lg me-2"></i>

                                Save Changes

                            </button>


                            <a
                                href="{% url 'user_management' %}"
                                class="btn btn-light btn-lg px-4"
                            >

                                Cancel

                            </a>

                        </div>


                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
