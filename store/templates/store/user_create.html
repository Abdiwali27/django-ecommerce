{% extends "store/dashboard_base.html" %}

{% block title %}
Add User - My Store
{% endblock %}


{% block dashboard_content %}

<div class="container-fluid" style="margin-top: 75px;">

    <div class="row justify-content-center">

        <div class="col-lg-8">


            <!-- HEADER -->

            <div class="mb-4">

                <h2 class="fw-bold mb-1">
                    Add New User
                </h2>

                <p class="text-muted">
                    Create a new user account and assign a role.
                </p>

            </div>


            <!-- FORM -->

            <div class="card border-0 shadow-sm rounded-4">

                <div class="card-body p-4 p-md-5">


                    <form method="POST">

                        {% csrf_token %}


                        <!-- USERNAME -->

                        <div class="mb-4">

                            <label
                                for="username"
                                class="form-label fw-semibold"
                            >
                                Username
                            </label>

                            <input
                                type="text"
                                name="username"
                                id="username"
                                class="form-control form-control-lg"
                                placeholder="Enter username"
                                required
                            >

                        </div>


                        <!-- EMAIL -->

                        <div class="mb-4">

                            <label
                                for="email"
                                class="form-label fw-semibold"
                            >
                                Email Address
                            </label>

                            <input
                                type="email"
                                name="email"
                                id="email"
                                class="form-control form-control-lg"
                                placeholder="Enter email address"
                            >

                        </div>


                        <!-- FIRST NAME -->

                        <div class="mb-4">

                            <label
                                for="first_name"
                                class="form-label fw-semibold"
                            >
                                First Name
                            </label>

                            <input
                                type="text"
                                name="first_name"
                                id="first_name"
                                class="form-control form-control-lg"
                                placeholder="Enter first name"
                            >

                        </div>


                        <!-- LAST NAME -->

                        <div class="mb-4">

                            <label
                                for="last_name"
                                class="form-label fw-semibold"
                            >
                                Last Name
                            </label>

                            <input
                                type="text"
                                name="last_name"
                                id="last_name"
                                class="form-control form-control-lg"
                                placeholder="Enter last name"
                            >

                        </div>


                        <!-- ROLE -->

                        <div class="mb-4">

                            <label
                                for="role"
                                class="form-label fw-semibold"
                            >
                                Role
                            </label>

                            <select
                                name="role"
                                id="role"
                                class="form-select form-select-lg"
                                required
                            >

                                <option value="">
                                    Select Role
                                </option>

                                <option value="Staff">
                                    Staff
                                </option>

                                <option value="Admin">
                                    Admin
                                </option>

                            </select>

                        </div>


                        <!-- PASSWORD -->

                        <div class="mb-4">

                            <label
                                for="password"
                                class="form-label fw-semibold"
                            >
                                Password
                            </label>

                            <input
                                type="password"
                                name="password"
                                id="password"
                                class="form-control form-control-lg"
                                placeholder="Enter password"
                                required
                            >

                        </div>


                        <!-- CONFIRM PASSWORD -->

                        <div class="mb-4">

                            <label
                                for="confirm_password"
                                class="form-label fw-semibold"
                            >
                                Confirm Password
                            </label>

                            <input
                                type="password"
                                name="confirm_password"
                                id="confirm_password"
                                class="form-control form-control-lg"
                                placeholder="Confirm password"
                                required
                            >

                        </div>


                        <!-- BUTTONS -->

                        <div class="d-flex gap-2">

                            <button
                                type="submit"
                                class="btn btn-primary btn-lg px-4"
                            >

                                <i class="bi bi-person-plus me-2"></i>

                                Create User

                            </button>


                            <a
                                href="{% url 'user_management' %}"
                                class="btn btn-light btn-lg px-4"
                            >

                                Cancel

                            </a>

                        </div>


                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
