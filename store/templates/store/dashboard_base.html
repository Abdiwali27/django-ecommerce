{% extends "store/base.html" %}


<style>
    /* =====================================================
   FIXED NAVBAR
===================================================== */

.fixed-navbar {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 72px;
    z-index: 1050;
}


/* =====================================================
   FIXED SIDEBAR
===================================================== */

.dashboard-sidebar {
    position: fixed;
    top: 72px;
    left: 0;

    width: 298px;
    height: calc(100vh - 72px);

    overflow-y: auto;

    z-index: 1040;
}


/* =====================================================
   DASHBOARD CONTENT
===================================================== */

.dashboard-content {
    margin-left: 298px;
    padding-top: 72px;
   

    min-height: 100vh;
}
</style>

{% block content %}

<div class="container-fluid px-0">

    <div class="row g-0">


        <!-- =====================================================
             SIDEBAR
        ====================================================== -->

        <aside class="col-md-3 col-lg-2">

            {% include "store/sidebar.html" %}

        </aside>


        <!-- =====================================================
             DASHBOARD CONTENT
        ====================================================== -->

        <main class="col-md-9 col-lg-10">

            <div class="p-4 p-lg-5">

                {% block dashboard_content %}
                {% endblock %}

            </div>

        </main>


    </div>

</div>

{% endblock %}
